[package]
name = "story-rewriter-desktop"
version = "0.1.0"
description = "Local-first AI novel rewriting desktop application"
authors = ["Story Rewriter Team"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "story_rewriter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4", features = ["v1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "^2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
